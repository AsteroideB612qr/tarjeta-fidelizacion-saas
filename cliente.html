<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Billetera</title>
    <style>
        :root { --primary-color: #1a1a1a; --stamp-color: #ffc107; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: auto; padding: 20px; position: relative; }
        .version-tag { position: absolute; top: 25px; right: 25px; background: #007bff; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; z-index: 10; }
        .wallet-header { text-align: center; margin-bottom: 30px; }
        .wallet-logo { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .wallet-name { font-size: 22px; font-weight: bold; color: #333; margin: 0; }
        .welcome-msg { font-size: 16px; color: #666; margin-top: 5px; }
        .socials-row { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .socials-row a { text-decoration: none; font-size: 24px; }
        .card-premium { background: var(--primary-color); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; overflow: hidden; color: white; }
        .card-body { padding: 25px 20px; text-align: center; }
        .card-body h2 { color: white; margin-top: 0; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 20px 0; }
        .stamp { width: 45px; height: 45px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: all 0.3s ease; }
        .filled { background-color: var(--stamp-color); border-color: var(--stamp-color); color: #000; transform: scale(1.05); }
        .vigencia { font-size: 11px; opacity: 0.6; margin-top: 10px; }
        .codigo-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; font-weight: bold; font-size: 28px; letter-spacing: 4px; margin-top: 15px; color: var(--stamp-color); }
        .btn-scan { width: 100%; padding: 12px; background-color: var(--stamp-color); color: #000; border: none; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .badge-pub { background: #28a745; color: white; font-size: 10px; padding: 2px 6px; border-radius: 8px; vertical-align: middle; }
        .auth-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        input { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { padding: 12px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button.btn-blue { background-color: #007bff; }
        .tabs { display: flex; margin-bottom: 20px; background: #f1f1f1; border-radius: 8px; padding: 5px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 6px; color: #666; font-size: 14px; }
        .tab.active { background: white; color: #007bff; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #magicOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; display:none; }
        .star-anim { font-size: 120px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; color: var(--stamp-color); }
        @keyframes pop { 0% { transform: scale(0) rotate(0deg); } 100% { transform: scale(1) rotate(360deg); } }
        .confetti { width: 12px; height: 12px; background-color: var(--stamp-color); position: absolute; animation: fall 2s linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <span class="version-tag">v6.0.0</span>

        <div id="authForm" class="auth-card hidden">
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="mostrarLogin()">Iniciar Sesión</div>
                <div class="tab" id="tabRegistro" onclick="mostrarRegistro()">Registrarse</div>
            </div>
            <div id="loginBox">
                <input type="email" id="loginEmail" placeholder="Tu Email">
                <input type="password" id="loginPass" placeholder="Tu Contraseña">
                <button onclick="login()">Iniciar Sesión</button>
            </div>
            <div id="registerBox" class="hidden">
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <input type="email" id="regEmail" placeholder="Tu Email">
                <input type="password" id="regPass" placeholder="Tu Contraseña">
                <input type="tel" id="regTel" placeholder="Celular">
                <input type="date" id="regNac" title="Fecha de nacimiento">
                <button class="btn-blue" onclick="registrar()">Registrarme</button>
            </div>
        </div>

        <div id="completarPerfilForm" class="auth-card hidden">
            <p>Tu cuenta existe, pero necesitas dejar tus datos para <strong id="negocioNombrePerfil"></strong>:</p>
            <input type="text" id="cpNombre" placeholder="Tu nombre">
            <input type="tel" id="cpTel" placeholder="Celular">
            <input type="date" id="cpNac" title="Fecha de nacimiento">
            <button onclick="vincularNegocio()">Vincular mi cuenta</button>
        </div>

        <div id="walleView" class="hidden">
            <div id="walletHeader"></div>
            <div id="tarjetasContainer"></div>
            <div id="reader" class="hidden"></div>
            <button class="btn-gray" onclick="cerrarSesion()" style="margin-top:20px; background: transparent; color: #666; font-weight: normal;">Cerrar Sesión</button>
        </div>
    </div>

    <div id="magicOverlay">
        <div class="star-anim">★</div>
        <h2 style="color:white; margin-top:30px;">¡Sello Agregado!</h2>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script type="module">
        import { db, auth } from "./firebase.js";
        import { doc, getDoc, collection, getDocs, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const urlParams = new URLSearchParams(window.location.search);
        const negocioId = urlParams.get('id');
        const premioIdURL = urlParams.get('premio');
        const accion = urlParams.get('accion'); 

        let clienteId = null, nombreNegocio = "", logoUrl = "", colorFondo = "#1a1a1a", colorSello = "#ffc107", redes = {};
        let isExpired = true, clientName = "";

        window.onload = async function() {
            if (!negocioId) return alert("Enlace inválido.");
            try {
                const docSnap = await getDoc(doc(db, "negocios", negocioId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    nombreNegocio = data.nombre;
                    if(data.diseno) {
                        logoUrl = data.diseno.logo || "";
                        colorFondo = data.diseno.colorFondo || "#1a1a1a";
                        colorSello = data.diseno.colorSello || "#ffc107";
                        document.documentElement.style.setProperty('--primary-color', colorFondo);
                        document.documentElement.style.setProperty('--stamp-color', colorSello);
                    }
                    if(data.redes) redes = data.redes;
                    if(data.fechaVencimiento) { isExpired = new Date(data.fechaVencimiento) < new Date(); }
                }
            } catch (e) { alert("Error al cargar negocio."); }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    clienteId = user.uid;
                    document.getElementById('authForm').classList.add('hidden');
                    const cSnap = await getDoc(doc(db, "negocios", negocioId, "clientes", clienteId));
                    if (!cSnap.exists()) {
                        document.getElementById('negocioNombrePerfil').innerText = nombreNegocio;
                        document.getElementById('completarPerfilForm').classList.remove('hidden');
                    } else {
                        clientName = cSnap.data().nombre;
                        document.getElementById('completarPerfilForm').classList.add('hidden');
                        document.getElementById('walleView').classList.remove('hidden');
                        renderHeader(); 
                        await cargarTarjetas();
                        if(accion === 'sello' && !isExpired) {
                            const k = 'stamped_' + negocioId;
                            if(sessionStorage.getItem(k) !== 'true') { sessionStorage.setItem(k, 'true'); sumarSelloDirecto(); } else { limpiarAccionURL(); }
                        }
                    }
                } else {
                    document.getElementById('authForm').classList.remove('hidden');
                    document.getElementById('walleView').classList.add('hidden');
                    mostrarLogin();
                }
            });
        };

        function renderHeader() {
            let socialsHtml = '';
            if(redes.ig) socialsHtml += `<a href="${redes.ig}" target="_blank">📸</a>`;
            if(redes.tk) socialsHtml += `<a href="${redes.tk}" target="_blank">🎵</a>`;
            if(redes.fb) socialsHtml += `<a href="${redes.fb}" target="_blank">👥</a>`;
            if(redes.mail) socialsHtml += `<a href="mailto:${redes.mail}" target="_blank">✉️</a>`;
            if(redes.wa) socialsHtml += `<a href="https://wa.me/${redes.wa.replace(/[^0-9]/g,'')}" target="_blank">💬</a>`;
            
            const headerHtml = `
                ${logoUrl ? `<img src="${logoUrl}" class="wallet-logo" alt="Logo">` : `<div class="wallet-logo" style="display:flex; align-items:center; justify-content:center; font-weight:bold; color:#333; font-size:32px;">${nombreNegocio.charAt(0)}</div>`}
                <h1 class="wallet-name">${nombreNegocio}</h1>
                ${clientName ? `<div class="welcome-msg">¡Bienvenido, ${clientName}!</div>` : ''}
                ${socialsHtml ? `<div class="socials-row">${socialsHtml}</div>` : ''}
            `;
            document.getElementById('walletHeader').innerHTML = headerHtml;
        }

        window.mostrarLogin = function() { document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegistro').classList.remove('active'); document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('registerBox').classList.add('hidden'); }
        window.mostrarRegistro = function() { document.getElementById('tabRegistro').classList.add('active'); document.getElementById('tabLogin').classList.remove('active'); document.getElementById('registerBox').classList.remove('hidden'); document.getElementById('loginBox').classList.add('hidden'); }
        window.login = async function() { try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value); } catch(e) { alert(e.message); } }
        window.registrar = async function() { const n=document.getElementById('regNombre').value, e=document.getElementById('regEmail').value, p=document.getElementById('regPass').value, t=document.getElementById('regTel').value, na=document.getElementById('regNac').value; if(!n||!e||!p||!t||!na) return alert("Completa todo."); try { const c = await createUserWithEmailAndPassword(auth, e, p); await setDoc(doc(db, "negocios", negocioId, "clientes", c.user.uid), { nombre:n, contacto:e, telefono:t, fechaNacimiento:na }); } catch(err) { alert(err.message); } }
        window.vincularNegocio = async function() { const n=document.getElementById('cpNombre').value, t=document.getElementById('cpTel').value, na=document.getElementById('cpNac').value; if(!n||!t||!na) return alert("Completa todo."); await setDoc(doc(db, "negocios", negocioId, "clientes", clienteId), { nombre:n, contacto:auth.currentUser.email, telefono:t, fechaNacimiento:na }); clientName=n; document.getElementById('completarPerfilForm').classList.add('hidden'); document.getElementById('walleView').classList.remove('hidden'); renderHeader(); await cargarTarjetas(); if(accion==='sello') sumarSelloDirecto(); }
        window.cerrarSesion = async function() { await signOut(auth); }

        async function cargarTarjetas() {
            const container = document.getElementById('tarjetasContainer');
            container.innerHTML = '';
            
            if(isExpired) {
                container.innerHTML = '<div class="auth-card"><h2>Promociones Pausadas</h2><p>El negocio está actualizando sus servicios. Vuelve pronto.</p></div>';
                return;
            }

            const premiosSnap = await getDocs(collection(db, "negocios", negocioId, "premios"));
            if(premiosSnap.empty) { container.innerHTML = '<div class="auth-card"><p>El negocio aún no tiene premios.</p></div>'; return; }

            const hoy = new Date().toISOString().split('T')[0];

            for(const docSnap of premiosSnap.docs) {
                const premio = docSnap.data(); const pId = docSnap.id;
                const tRef = doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId);
                const tSnap = await getDoc(tRef);
                let tData = null;
                if(!tSnap.exists() && pId === premioIdURL) { await setDoc(tRef, { sellos: premio.sellosIniciales || 0 }, { merge: true }); tData = (await getDoc(tRef)).data(); } 
                else if (tSnap.exists()) tData = tSnap.data();
                else if (premio.visibilidad === 'publico') { await setDoc(tRef, { sellos: premio.sellosIniciales || 0 }, { merge: true }); tData = (await getDoc(tRef)).data(); }
                if (!tData) continue;

                let sAct = tData.sellos || 0; let exp = (premio.vigenciaFin && hoy > premio.vigenciaFin); let cod = tData.codigoRedencion;
                let hS = ''; for(let i=0; i<premio.sellosRequeridos; i++) hS += i < sAct ? `<div class="stamp filled">★</div>` : '<div class="stamp"></div>';
                let comp = sAct >= premio.sellosRequeridos;
                if (!exp && comp && !cod) { cod = Math.floor(1000+Math.random()*9000).toString(); await updateDoc(tRef, { codigoRedencion: cod }, { merge: true }); }
                
                let aH = '';
                if (exp) aH = '<p style="color:#ff6b6b; font-weight:bold;">❌ Promoción expirada</p>';
                else if (comp) aH = `<p style="font-weight:bold;">¡Felicidades! Canjea tu premio.</p><div class="codigo-box">CÓDIGO: ${cod || 'XXXX'}</div>`;
                else aH = `<p style="font-size:14px; opacity:0.8;">Te faltan ${premio.sellosRequeridos - sAct} sellos</p><button class="btn-scan" onclick="iniciarEscaneoQR('${pId}')">Escanear para sumar Sello</button>`;

                const vB = premio.visibilidad === 'publico' ? '<span class="badge-pub">Público</span>' : '';
                container.innerHTML += `<div class="card-premium"><div class="card-body"><h2>${premio.nombre} ${vB}</h2><div class="stamps">${hS}</div><div class="vigencia">Válido del ${premio.vigenciaInicio} al ${premio.vigenciaFin}</div>${aH}</div></div>`;
            }
        }

        async function sumarSelloDirecto() {
            if(isExpired) return;
            const pS = await getDocs(collection(db, "negocios", negocioId, "premios")); let aC = [];
            for(const d of pS.docs) { const p=d.data(), pId=d.id; const tS=await getDoc(doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId)); let s=0, hR=false; if(tS.exists()) { s=tS.data().sellos||0; hR=!!tS.data().codigoRedencion; } else if(p.visibilidad==='publico') s=p.sellosIniciales||0; else continue; if(s<p.sellosRequeridos && !hR) aC.push({pId, n:p.nombre}); }
            if(aC.length===0) { limpiarAccionURL(); return; } let tId;
            if(aC.length===1) tId=aC[0].pId; else { let o="¿A cuál sumar?\n"; aC.forEach((c,i)=>o+=`${i+1}. ${c.n}\n`); const s=prompt(o); const i=parseInt(s)-1; if(isNaN(i)||i<0||i>=aC.length){limpiarAccionURL();return;} tId=aC[i].pId; }
            await sumarSello(tId); mostrarAnimacionMagica(); limpiarAccionURL();
        }

        function mostrarAnimacionMagica() {
            const o = document.getElementById('magicOverlay'); o.style.display='flex';
            for(let i=0; i<30; i++) { let c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.animationDelay=Math.random()*2+'s'; c.style.backgroundColor=[colorSello,colorFondo,'#fff'][Math.floor(Math.random()*3)]; o.appendChild(c); }
            setTimeout(()=>{o.style.display='none'; o.querySelectorAll('.confetti').forEach(c=>c.remove());}, 2500);
        }

        function limpiarAccionURL() { history.replaceState(null, null, window.location.pathname + `?id=${negocioId}`); }

        window.iniciarEscaneoQR = function(pId) {
            const r = document.getElementById('reader'); r.classList.remove('hidden'); const h = new Html5Qrcode("reader");
            h.start({facingMode:"environment"}, {fps:10, qrbox:{width:200,height:200}}, async(dT)=>{ h.stop(); r.classList.add('hidden'); if(dT.includes(`id=${negocioId}&accion=sello`)) { await sumarSello(pId); mostrarAnimacionMagica(); } else alert("QR inválido."); }, ()=>{}).catch(err=>alert("Error cámara."));
        }

        async function sumarSello(pIdF) {
            if(isExpired) return alert("Suscripción del negocio vencida.");
            try {
                const pS = await getDocs(collection(db, "negocios", negocioId, "premios"));
                for(const d of pS.docs) { const p=d.data(), pId=d.id; if(pIdF && pId !== pIdF) continue; const tR=doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId); const tS=await getDoc(tR); let cS=0; if(tS.exists()) { cS=tS.data().sellos||0; if(tS.data().codigoRedencion) continue; } else if(p.visibilidad==='publico') cS=p.sellosIniciales||0; else continue; if(cS<p.sellosRequeridos) { let d={sellos:cS+1}; if(cS+1>=p.sellosRequeridos) d.codigoRedencion=Math.floor(1000+Math.random()*9000).toString(); await setDoc(tR, d, {merge:true}); await cargarTarjetas(); return; } }
            } catch(e) { alert("Error sello."); }
        }
    </script>
</body>
</html>
