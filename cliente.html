<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Fidelización</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .card-container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; font-size: 24px; }
        input { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; width: 100%; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .stamp { width: 50px; height: 50px; border: 2px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .filled { background-color: #ffc107; border: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card-container">
        <h1 id="negocioNombre">Cargando...</h1>
        
        <!-- Formulario de Registro -->
        <div id="registroForm">
            <p>Para unirte al programa de recompensas, déjanos tus datos:</p>
            <input type="text" id="clienteNombre" placeholder="Tu nombre">
            <input type="text" id="clienteContacto" placeholder="Email o Teléfono">
            <button onclick="registrarCliente()">Activar Mi Tarjeta</button>
        </div>

        <!-- Tarjeta Digital (Oculta hasta registrarse) -->
        <div id="tarjetaDigital" class="hidden">
            <h2>¡Hola, <span id="saludoNombre"></span>!</h2>
            <p>Te faltan <span id="sellosRestantes"></span> sellos para tu premio: <strong id="premioTexto"></strong></p>
            <div class="stamps" id="contenedorSellos">
                <!-- Los sellos se generarán aquí -->
            </div>
            <p style="font-size: 12px; color: gray;">Muestra esta pantalla al cajero para recibir tu sello.</p>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. Obtener el ID del negocio desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const negocioId = urlParams.get('id');

        let configNegocio = null;

        // 2. Cargar datos del negocio
        window.onload = async function() {
            if (!negocioId) return alert("Enlace inválido.");

            try {
                const docRef = doc(db, "negocios", negocioId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('negocioNombre').innerText = data.nombre;
                    configNegocio = data.config;
                    
                    if (configNegocio) {
                        document.getElementById('premioTexto').innerText = configNegocio.premio;
                    } else {
                        alert("El negocio aún no ha configurado su tarjeta. Vuelve más tarde.");
                    }
                } else {
                    document.getElementById('negocioNombre').innerText = "Negocio no encontrado";
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // 3. Registrar cliente en Firebase
        window.registrarCliente = async function() {
            const nombre = document.getElementById('clienteNombre').value;
            const contacto = document.getElementById('clienteContacto').value;
            
            if(!nombre || !contacto) return alert("Por favor completa tus datos.");

            try {
                // Guardamos al cliente dentro de la subcolección 'clientes' del negocio
                const clientesRef = collection(db, "negocios", negocioId, "clientes");
                const nuevoClienteRef = await addDoc(clientesRef, {
                    nombre: nombre,
                    contacto: contacto,
                    sellos: 0,
                    creadoEn: new Date()
                });

                // Guardamos el ID del cliente localmente para no pedirle que se registre de nuevo
                localStorage.setItem('clienteId_' + negocioId, nuevoClienteRef.id);
                
                mostrarTarjeta(0, nombre);
            } catch (e) {
                alert("Error al registrar: " + e.message);
            }
        }

        // 4. Mostrar tarjeta visual
        function mostrarTarjeta(sellosActuales, nombre) {
            document.getElementById('registroForm').classList.add('hidden');
            document.getElementById('tarjetaDigital').classList.remove('hidden');
            document.getElementById('saludoNombre').innerText = nombre;
            
            const contenedor = document.getElementById('contenedorSellos');
            contenedor.innerHTML = '';
            
            const totalSellos = configNegocio.sellos;
            for(let i = 0; i < totalSellos; i++) {
                if(i < sellosActuales) {
                    contenedor.innerHTML += '<div class="stamp filled">⭐</div>';
                } else {
                    contenedor.innerHTML += '<div class="stamp"></div>';
                }
            }

            const restantes = totalSellos - sellosActuales;
            document.getElementById('sellosRestantes').innerText = restantes;
        }
    </script>
</body>
</html>
