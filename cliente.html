<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Billetera</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        h1 { font-size: 22px; color: #333; } h2 { font-size: 18px; color: #007bff; margin-top: 0; }
        input { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; width: 100%; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; } button.btn-blue { background-color: #007bff; } button.btn-gray { background-color: #6c757d; }
        .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; }
        .stamp { width: 35px; height: 35px; border: 2px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .filled { background-color: #ffc107; border: none; } .hidden { display: none; }
        .expired { color: #dc3545; font-weight: bold; }
        .vigencia { font-size: 12px; color: #6c757d; margin-top: 5px; }
        .codigo-box { background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 24px; letter-spacing: 2px; margin-top: 10px; }
        .tabs { display: flex; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-bottom: 2px solid #ccc; background: #f1f1f1; }
        .tab.active { border-bottom: 2px solid #007bff; background: white; font-weight: bold; }

        /* Modal PIN */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:100; }
        .modal-box { background:white; padding:20px; border-radius:10px; width:300px; text-align:center; }
        .pin-input { font-size: 24px; letter-spacing: 10px; text-align: center; margin-bottom: 15px; }
        .keypad { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
        .keypad button { width:100%; font-size:20px; padding:15px; background:#f1f1f1; color:#333; margin-top:0; }
        
        /* Animación Mágica */
        #magicOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.98); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; display:none; }
        .star-anim { font-size: 100px; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .confetti { width: 10px; height: 10px; background-color: #ffc107; position: absolute; animation: fall 2s linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }
        
        .btn-aux { background: transparent; color: #6c757d; border: 1px solid #ccc; font-size: 12px; padding: 5px 10px; width: auto; margin: 15px auto 0; display: block; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="negocioNombre" style="text-align:center;">Cargando...</h1>

        <div id="authForm" class="card hidden">
            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="mostrarLogin()">Iniciar Sesión</div>
                <div class="tab" id="tabRegistro" onclick="mostrarRegistro()">Registrarse</div>
            </div>
            <div id="loginBox">
                <h2>¡Hola de nuevo!</h2>
                <input type="email" id="loginEmail" placeholder="Tu Email">
                <input type="password" id="loginPass" placeholder="Tu Contraseña">
                <button onclick="login()">Iniciar Sesión</button>
            </div>
            <div id="registerBox" class="hidden">
                <h2>Crear Cuenta</h2>
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <input type="email" id="regEmail" placeholder="Tu Email">
                <input type="password" id="regPass" placeholder="Tu Contraseña">
                <input type="tel" id="regTel" placeholder="Celular (Ej: 5212345678)">
                <input type="date" id="regNac" title="Fecha de nacimiento">
                <button class="btn-blue" onclick="registrar()">Registrarme</button>
            </div>
        </div>

        <div id="completarPerfilForm" class="card hidden">
            <h2>¡Bienvenido!</h2>
            <p>Tu cuenta existe, pero necesitas dejar tus datos para <strong id="negocioNombrePerfil"></strong>:</p>
            <input type="text" id="cpNombre" placeholder="Tu nombre">
            <input type="tel" id="cpTel" placeholder="Celular (Ej: 5212345678)">
            <input type="date" id="cpNac" title="Fecha de nacimiento">
            <button onclick="vincularNegocio()">Vincular mi cuenta</button>
        </div>

        <div id="walleView" class="hidden">
            <div id="tarjetasContainer"></div>
            <button class="btn-gray" onclick="cerrarSesion()" style="margin-top:20px;">Cerrar Sesión</button>
        </div>
    </div>

    <!-- Modal PIN Auxiliar -->
    <div id="pinModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Validar Sello</h2>
            <p style="font-size:12px; color:#666;">Cajero: Ingrese PIN</p>
            <input type="password" id="pinInput" class="pin-input" maxlength="4" readonly>
            <div id="pinError" style="color:#dc3545; font-size:12px; height:15px; margin-bottom:10px;"></div>
            <div class="keypad">
                <button onclick="addPin('1')">1</button><button onclick="addPin('2')">2</button><button onclick="addPin('3')">3</button>
                <button onclick="addPin('4')">4</button><button onclick="addPin('5')">5</button><button onclick="addPin('6')">6</button>
                <button onclick="addPin('7')">7</button><button onclick="addPin('8')">8</button><button onclick="addPin('9')">9</button>
                <button onclick="closePinModal()" style="background:#dc3545; color:white;">X</button>
                <button onclick="addPin('0')">0</button>
                <button onclick="submitPin()" style="background:#28a745; color:white;">✓</button>
            </div>
        </div>
    </div>

    <!-- Animación Mágica -->
    <div id="magicOverlay">
        <div class="star-anim">⭐</div>
        <h2 style="color:#28a745; margin-top:20px;">¡Sello Agregado!</h2>
    </div>

    <script type="module">
        import { db, auth } from "./firebase.js";
        import { doc, getDoc, collection, getDocs, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const urlParams = new URLSearchParams(window.location.search);
        const negocioId = urlParams.get('id');
        const premioIdURL = urlParams.get('premio');
        const accion = urlParams.get('accion'); // 'sello' si viene de QR externo

        let clienteId = null;
        let pinNegocio = "";
        let nombreNegocio = "";
        let intentosPin = 0;
        let bloqueadoHasta = 0;
        let targetCardParaSello = null;

        window.onload = async function() {
            if (!negocioId) return alert("Enlace inválido.");
            try {
                const docSnap = await getDoc(doc(db, "negocios", negocioId));
                if (docSnap.exists()) {
                    nombreNegocio = docSnap.data().nombre;
                    document.getElementById('negocioNombre').innerText = "📱 " + nombreNegocio;
                    pinNegocio = docSnap.data().pin || "1234";
                }
            } catch (e) { alert("Error al cargar negocio."); }

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    clienteId = user.uid;
                    document.getElementById('authForm').classList.add('hidden');
                    const clienteSnap = await getDoc(doc(db, "negocios", negocioId, "clientes", clienteId));
                    if (!clienteSnap.exists()) {
                        document.getElementById('negocioNombrePerfil').innerText = nombreNegocio;
                        document.getElementById('completarPerfilForm').classList.remove('hidden');
                        document.getElementById('walleView').classList.add('hidden');
                    } else {
                        document.getElementById('completarPerfilForm').classList.add('hidden');
                        document.getElementById('walleView').classList.remove('hidden');
                        await cargarTarjetas();
                        if(accion === 'sello') {
                            sumarSelloDirecto(); // Magia automática por NFC o QR Externo
                        }
                    }
                } else {
                    document.getElementById('authForm').classList.remove('hidden');
                    document.getElementById('completarPerfilForm').classList.add('hidden');
                    document.getElementById('walleView').classList.add('hidden');
                    mostrarLogin();
                }
            });
        };

        window.mostrarLogin = function() { document.getElementById('tabLogin').classList.add('active'); document.getElementById('tabRegistro').classList.remove('active'); document.getElementById('loginBox').classList.remove('hidden'); document.getElementById('registerBox').classList.add('hidden'); }
        window.mostrarRegistro = function() { document.getElementById('tabRegistro').classList.add('active'); document.getElementById('tabLogin').classList.remove('active'); document.getElementById('registerBox').classList.remove('hidden'); document.getElementById('loginBox').classList.add('hidden'); }
        
        window.login = async function() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch(e) { alert("Error: " + e.message); }
        }
        window.registrar = async function() {
            const nombre = document.getElementById('regNombre').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const tel = document.getElementById('regTel').value;
            const nac = document.getElementById('regNac').value;
            if(!nombre || !email || !pass || !tel || !nac) return alert("Completa todos los campos.");
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "negocios", negocioId, "clientes", cred.user.uid), { nombre, contacto: email, telefono: tel, fechaNacimiento: nac });
            } catch(e) {
                if(e.code === 'auth/email-already-in-use') { alert("Este correo ya está registrado. Inicia sesión para vincularlo."); mostrarLogin(); } else { alert("Error: " + e.message); }
            }
        }
        window.vincularNegocio = async function() {
            const nombre = document.getElementById('cpNombre').value;
            const tel = document.getElementById('cpTel').value;
            const nac = document.getElementById('cpNac').value;
            if(!nombre || !tel || !nac) return alert("Completa tus datos.");
            await setDoc(doc(db, "negocios", negocioId, "clientes", clienteId), { nombre, contacto: auth.currentUser.email, telefono: tel, fechaNacimiento: nac });
            document.getElementById('completarPerfilForm').classList.add('hidden');
            document.getElementById('walleView').classList.remove('hidden');
            await cargarTarjetas();
            if(accion === 'sello') sumarSelloDirecto();
        }
        window.cerrarSesion = async function() { await signOut(auth); }

        async function cargarTarjetas() {
            const container = document.getElementById('tarjetasContainer');
            container.innerHTML = '';
            const premiosSnap = await getDocs(collection(db, "negocios", negocioId, "premios"));
            if(premiosSnap.empty) { container.innerHTML = '<div class="card"><p>El negocio aún no tiene premios.</p></div>'; return; }

            const hoy = new Date().toISOString().split('T')[0];

            for(const docSnap of premiosSnap.docs) {
                const premio = docSnap.data(); const pId = docSnap.id;
                const tarjetaRef = doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId);
                const tarjetaSnap = await getDoc(tarjetaRef);
                
                if(!tarjetaSnap.exists() && pId === premioIdURL) { await setDoc(tarjetaRef, { sellos: premio.sellosIniciales || 0 }); } 
                else if(!tarjetaSnap.exists()) { continue; }

                const tarjetaData = tarjetaSnap.exists() ? tarjetaSnap.data() : { sellos: premio.sellosIniciales || 0 };
                let sellosActuales = tarjetaData.sellos || 0;
                let expirado = (premio.vigenciaFin && hoy > premio.vigenciaFin);

                let htmlStamps = '';
                for(let i=0; i<premio.sellosRequeridos; i++) htmlStamps += i < sellosActuales ? '<div class="stamp filled">⭐</div>' : '<div class="stamp"></div>';
                const completado = sellosActuales >= premio.sellosRequeridos;

                if (!expirado && completado && !tarjetaData.codigoRedencion) {
                    const code = Math.floor(1000 + Math.random() * 9000).toString();
                    await updateDoc(tarjetaRef, { codigoRedencion: code });
                    tarjetaData.codigoRedencion = code; 
                }

                let accionHTML = '';
                if (expirado) {
                    accionHTML = '<p class="expired">❌ Promoción expirada</p>';
                } else if (completado) {
                    accionHTML = `<p style="color:#28a745; font-weight:bold;">¡Felicidades! Canjea tu premio.</p><div class="codigo-box">CÓDIGO: ${tarjetaData.codigoRedencion}</div><p style="font-size:12px;">Muestra este código al cajero.</p>`;
                } else {
                    accionHTML = `<p>Te faltan ${premio.sellosRequeridos - sellosActuales} sellos</p>`;
                    accionHTML += `<button class="btn-aux" onclick="abrirPinPad('${pId}')">Sumar Sello Manual (Cajero)</button>`;
                }

                container.innerHTML += `<div class="card"><h2>${premio.nombre}</h2><div class="stamps">${htmlStamps}</div><div class="vigencia">Válido del ${premio.vigenciaInicio} al ${premio.vigenciaFin}</div>${accionHTML}</div>`;
            }
        }

        // --- LÓGICA MAGIC NFC / QR EXTERNO (Automático) ---
        async function sumarSelloDirecto() {
            const premiosSnap = await getDocs(collection(db, "negocios", negocioId, "premios"));
            let activeCards = [];
            for(const docSnap of premiosSnap.docs) {
                const premio = docSnap.data(); const pId = docSnap.id;
                const tarjetaSnap = await getDoc(doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId));
                if(tarjetaSnap.exists() && tarjetaSnap.data().sellos < premio.sellosRequeridos && !tarjetaSnap.data().codigoRedencion) {
                    activeCards.push({pId, nombre: premio.nombre});
                }
            }

            if (activeCards.length === 0) { 
                limpiarAccionURL(); 
                return; 
            }

            let targetCardId;
            if (activeCards.length === 1) {
                targetCardId = activeCards[0].pId;
            } else {
                let opciones = "Tienes varias tarjetas activas. ¿A cuál sumar el sello?\n";
                activeCards.forEach((c, i) => opciones += `${i+1}. ${c.nombre}\n`);
                const seleccion = prompt(opciones);
                const index = parseInt(seleccion) - 1;
                if (isNaN(index) || index < 0 || index >= activeCards.length) { limpiarAccionURL(); return; }
                targetCardId = activeCards[index].pId;
            }

            await sumarSello(targetCardId);
            mostrarAnimacionMagica();
            limpiarAccionURL();
        }

        function mostrarAnimacionMagica() {
            const overlay = document.getElementById('magicOverlay');
            overlay.style.display = 'flex';
            for(let i=0; i<20; i++) {
                let c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.animationDelay = Math.random() * 2 + 's';
                c.style.backgroundColor = ['#ffc107', '#28a745', '#007bff'][Math.floor(Math.random()*3)];
                overlay.appendChild(c);
            }
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.querySelectorAll('.confetti').forEach(c => c.remove());
            }, 2500);
        }

        function limpiarAccionURL() { history.replaceState(null, null, window.location.pathname + `?id=${negocioId}`); }

        // --- LÓGICA PIN PAD (Auxiliar) ---
        window.abrirPinPad = function(pId) {
            targetCardParaSello = pId;
            if (Date.now() < bloqueadoHasta) {
                const secs = Math.ceil((bloqueadoHasta - Date.now())/1000);
                alert("Demasiados intentos. Bloqueado por " + secs + " segundos.");
                return;
            }
            intentosPin = 0;
            document.getElementById('pinInput').value = '';
            document.getElementById('pinError').innerText = '';
            document.getElementById('pinModal').classList.remove('hidden');
        }

        window.closePinModal = function() {
            document.getElementById('pinModal').classList.add('hidden');
            targetCardParaSello = null;
        }

        window.addPin = function(num) {
            const input = document.getElementById('pinInput');
            if(input.value.length < 4) input.value += num;
        }

        window.submitPin = async function() {
            const enteredPin = document.getElementById('pinInput').value;
            if(enteredPin === pinNegocio) {
                document.getElementById('pinModal').classList.add('hidden');
                await sumarSello(targetCardParaSello);
                mostrarAnimacionMagica();
                targetCardParaSello = null;
            } else {
                intentosPin++;
                if(intentosPin >= 3) {
                    bloqueadoHasta = Date.now() + 60000;
                    document.getElementById('pinError').innerText = "Bloqueado 60 seg.";
                    document.getElementById('pinInput').value = '';
                } else {
                    document.getElementById('pinError').innerText = "PIN incorrecto. Intentos: " + intentosPin + "/3";
                    document.getElementById('pinInput').value = '';
                }
            }
        }

        async function sumarSello(pIdForzado) {
            try {
                const premiosSnap = await getDocs(collection(db, "negocios", negocioId, "premios"));
                for(const docSnap of premiosSnap.docs) {
                    const premio = docSnap.data(); const pId = docSnap.id;
                    if(pIdForzado && pId !== pIdForzado) continue;

                    const tarjetaRef = doc(db, "negocios", negocioId, "clientes", clienteId, "tarjetas", pId);
                    const tarjetaSnap = await getDoc(tarjetaRef);
                    if(tarjetaSnap.exists() && tarjetaSnap.data().sellos < premio.sellosRequeridos) {
                        await updateDoc(tarjetaRef, { sellos: tarjetaSnap.data().sellos + 1 });
                        await cargarTarjetas(); return;
                    }
                }
            } catch(e) { alert("Error al sumar sello."); }
        }
    </script>
</body>
</html>
