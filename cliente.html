<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Fidelización</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .card-container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; font-size: 24px; }
        input { padding: 10px; margin: 10px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; width: 100%; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .stamp-btn { background-color: #ffc107; color: black; }
        .stamps { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px 0; }
        .stamp { width: 50px; height: 50px; border: 2px dashed #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .filled { background-color: #ffc107; border: none; }
        .hidden { display: none; }
        .premio-listo { background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card-container">
        <h1 id="negocioNombre">Cargando...</h1>
        
        <!-- Formulario de Registro -->
        <div id="registroForm">
            <p>Para unirte al programa de recompensas, déjanos tus datos:</p>
            <input type="text" id="clienteNombre" placeholder="Tu nombre">
            <input type="text" id="clienteContacto" placeholder="Email o Teléfono">
            <button onclick="registrarCliente()">Activar Mi Tarjeta</button>
        </div>

        <!-- Tarjeta Digital (Oculta hasta registrarse) -->
        <div id="tarjetaDigital" class="hidden">
            <h2>¡Hola, <span id="saludoNombre"></span>!</h2>
            <div id="mensajePremio" class="premio-listo hidden">¡Felicidades! Ya puedes reclamar tu premio: <span id="premioGanado"></span></div>
            
            <p>Te faltan <span id="sellosRestantes"></span> sellos para tu premio: <strong id="premioTexto"></strong></p>
            <div class="stamps" id="contenedorSellos"></div>
            
            <button class="stamp-btn" id="btnSello" onclick="solicitarSello()">Solicitar Sello</button>
            <p style="font-size: 12px; color: gray; margin-top:15px;">Entrega tu teléfono al cajero para validar el sello.</p>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { doc, getDoc, collection, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const negocioId = urlParams.get('id');

        let configNegocio = null;
        let clienteActualId = null;
        let sellosActuales = 0;

        window.onload = async function() {
            if (!negocioId) return alert("Enlace inválido.");

            try {
                const docRef = doc(db, "negocios", negocioId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('negocioNombre').innerText = data.nombre;
                    configNegocio = data.config;
                    
                    if (configNegocio) {
                        document.getElementById('premioTexto').innerText = configNegocio.premio;
                        document.getElementById('premioGanado').innerText = configNegocio.premio;
                    }
                } else {
                    document.getElementById('negocioNombre').innerText = "Negocio no encontrado";
                }

                // Revisar si el cliente ya está registrado en este dispositivo
                clienteActualId = localStorage.getItem('clienteId_' + negocioId);
                if(clienteActualId) {
                    await cargarDatosCliente(clienteActualId);
                }
            } catch (e) {
                alert("Error al cargar datos.");
            }
        };

        window.registrarCliente = async function() {
            const nombre = document.getElementById('clienteNombre').value;
            const contacto = document.getElementById('clienteContacto').value;
            
            if(!nombre || !contacto) return alert("Por favor completa tus datos.");

            try {
                const clientesRef = collection(db, "negocios", negocioId, "clientes");
                const nuevoClienteRef = await addDoc(clientesRef, {
                    nombre: nombre,
                    contacto: contacto,
                    sellos: 0,
                    creadoEn: new Date()
                });

                clienteActualId = nuevoClienteRef.id;
                localStorage.setItem('clienteId_' + negocioId, clienteActualId);
                
                mostrarTarjeta(0, nombre);
            } catch (e) {
                alert("Error al registrar.");
            }
        };

        async function cargarDatosCliente(id) {
            const clienteRef = doc(db, "negocios", negocioId, "clientes", id);
            const clienteSnap = await getDoc(clienteRef);
            
            if(clienteSnap.exists()) {
                const data = clienteSnap.data();
                sellosActuales = data.sellos || 0;
                mostrarTarjeta(sellosActuales, data.nombre);
            }
        }

        function mostrarTarjeta(sellos, nombre) {
            document.getElementById('registroForm').classList.add('hidden');
            document.getElementById('tarjetaDigital').classList.remove('hidden');
            document.getElementById('saludoNombre').innerText = nombre;
            
            const contenedor = document.getElementById('contenedorSellos');
            contenedor.innerHTML = '';
            
            const totalSellos = configNegocio.sellos;
            for(let i = 0; i < totalSellos; i++) {
                if(i < sellos) {
                    contenedor.innerHTML += '<div class="stamp filled">⭐</div>';
                } else {
                    contenedor.innerHTML += '<div class="stamp"></div>';
                }
            }

            // Lógica de premio
            if(sellos >= totalSellos) {
                document.getElementById('sellosRestantes').innerText = "0";
                document.getElementById('mensajePremio').classList.remove('hidden');
                document.getElementById('btnSello').innerText = "Reclamar Premio y Reiniciar";
            } else {
                document.getElementById('sellosRestantes').innerText = totalSellos - sellos;
                document.getElementById('mensajePremio').classList.add('hidden');
                document.getElementById('btnSello').innerText = "Solicitar Sello";
            }
        }

        window.solicitarSello = async function() {
            // Si ya alcanzó el premio, al presionar se reinicia a 0
            if(sellosActuales >= configNegocio.sellos) {
                await actualizarSellos(0);
                return;
            }

            const pinIngresado = prompt("Cajero: Ingrese el PIN secreto para validar sello:");
            if(pinIngresado === null) return; // Canceló
            
            if(pinIngresado === configNegocio.pin) {
                await actualizarSellos(sellosActuales + 1);
            } else {
                alert("PIN incorrecto. No se puede agregar el sello.");
            }
        };

        async function actualizarSellos(nuevoTotal) {
            try {
                const clienteRef = doc(db, "negocios", negocioId, "clientes", clienteActualId);
                await updateDoc(clienteRef, { sellos: nuevoTotal });
                
                sellosActuales = nuevoTotal;
                mostrarTarjeta(sellosActuales, document.getElementById('saludoNombre').innerText);
            } catch(e) {
                alert("Error al actualizar la tarjeta.");
            }
        }
    </script>
</body>
</html>
