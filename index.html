<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FidelidadPro - SaaS de Tarjetas de Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .stamps { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .stamp { width: 40px; height: 40px; border: 2px dashed #ccc; border-radius: 50%; }
        .filled { background-color: #ffc107; border: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>☕ Cafetería Central</h1>
        <p>Tu tarjeta de fidelización digital</p>
        <div class="stamps">
            <div class="stamp filled"></div>
            <div class="stamp filled"></div>
            <div class="stamp"></div>
            <div class="stamp"></div>
            <div class="stamp"></div>
        </div>
        <p>Compra 3 cafés más y el siguiente es ¡Gratis!</p>
    </div>

    <!-- Aquí cargaremos la lógica de Firebase en el próximo paso -->
    <script src="app.js"></script>
</body>
</html>
